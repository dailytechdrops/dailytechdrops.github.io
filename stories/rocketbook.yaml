  no_product_ref: true
  still: >-
    Photorealistic vertical photo of a wooden desk buried under tall teetering stacks of used spiral notebooks and
    loose scribbled paper pages, a coffee mug and a pen lost among them, bright morning window light, shot from desk
    level, shallow depth of field. No people, no hands, no readable text, no brand logos, screens dark.
  motion: >-
    Slow steady push-in toward the tall stack of notebooks. Soft window light shifts gently. The stack stays still.
    Nothing else moves. No people, no hands, no text.
- id: shot2
  product_photo: assets/products/rocketbook-fusion.jpg
  still: >-
    Photorealistic vertical photo of @product, a single black notebook, lying closed on a clean bright light oak desk
    next to a laptop, a coffee mug and a pen, soft morning window light, shallow depth of field. The notebook keeps
    exactly the shape, color and cover design of @product. No people, no hands, no text, screens dark.
  motion: >-
    Slow steady push-in. Nothing else moves. No people, no hands, no text.
  still_only: true
- id: shot3
  product_photo: assets/products/rocketbook-fusion.jpg
  still: >-
    Photorealistic vertical wide photo of a calm tidy home office desk with @product, a single black notebook, open
