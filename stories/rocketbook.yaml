# Nov 8 2026 test reel (new "wow" product): Rocketbook Fusion reusable notebook, "Drowning in notebooks?".
# Same format as the Echo Dot pilot: opens on a catchy visual with hook text, mid-reel question, ~10s.
# No people, no hands, slow camera only (the wipe-clean demo needs hands, so the story is the paper pile vs one notebook).
name: rocketbook
budget_credits: 60
product_photo: assets/products/rocketbook-fusion.jpg
shots:
