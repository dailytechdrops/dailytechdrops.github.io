# Daily Tech Drops: brand and pipeline settings.
# Secrets (API keys, tokens) never go here. They live in GitHub Actions secrets.

brand:
  name: Daily Tech Drops
  handle: daily_tech_drops
  voice: >
    Upbeat gadget fan with "you gotta see this" energy, showing the coolest
    tech finds on Amazon. Lead with the wow moment in the first second, then
    why people want it. One useful tip per product. Short sentences, plain
    words, no tired hype like "game changer".

amazon:
  # Your Amazon Associates tracking tag, for example dailytechdrops-20.
  # Read from the AMAZON_TAG secret if set; this value is the fallback.
  tag: ""
  marketplace: www.amazon.com
  # Extra tracking IDs made in Associates Central (Account Settings > Manage Tracking IDs),
  # one per channel, so the Orders report shows where each sale came from.
  # Leave one empty and that channel keeps the base tag above.
  channel_tags:
    shop: ""        # the shop page (IG bio, SHOP DMs)
    facebook: ""    # links in Facebook reel captions
    youtube: ""     # links in YouTube Shorts descriptions
    threads: ""     # links in Threads posts
  # Creator Connections (Kevin invited Oct 26 2026): brands pay a bonus commission on top of the
  # normal rate, but only through the campaign's own link ("Get affiliate link" on the campaign page).
  # ASIN: link. Every post, DM and shop card for that ASIN then uses it. Remove an entry when
  # its campaign ends.
  campaign_links:
    # zakotu MD10 mini body camera, 25%, ends 2027-03-30
    B0HJ1HXBWY: "https://www.amazon.com/dp/B0HJ1HXBWY?ref=t_ac_view_request_product_image&campaignId=amzn1.campaign.2ZDVTB3J15QZ5&linkCode=tr1&tag=thegadgetgrab-20&linkId=amzn1.campaign.2ZDVTB3J15QZ5_1793023526145"
    # SYLCXX electric letter opener, 25%, ends 2026-11-17
    B0BZDJCGSR: "https://www.amazon.com/dp/B0BZDJCGSR?ref=t_ac_view_request_product_image&campaignId=amzn1.campaign.2W47CLDX1VN6F&linkCode=tr1&tag=thegadgetgrab-20&linkId=amzn1.campaign.2W47CLDX1VN6F_1793023578395"
    # ShSiXin 3-in-1 Apple Watch charging cable, 30%, ends 2026-11-18
    B0C19CBT2N: "https://www.amazon.com/dp/B0C19CBT2N?ref=t_ac_view_request_product_image&campaignId=amzn1.campaign.14PEBM1R5AEMY&linkCode=tr1&tag=thegadgetgrab-20&linkId=amzn1.campaign.14PEBM1R5AEMY_1793023615034"

analytics:
  # GoatCounter site code (free, goatcounter.com): counts shop page visits and which
  # product cards are tapped. The weekly report reads it with the GOATCOUNTER_TOKEN secret.
  goatcounter: dailytechdrops

instagram:
  comment_keyword: SHOP          # Viewers comment this word to get the link by DM
  comment_aliases: [LINK]        # Also answered, since people guess these
  hashtags_per_post: 5           # Instagram now counts at most 5; extra tags are wasted
  # Separate carousels reached 1 to 8 people while reels reached about 100 (report, Oct 25 2026),
  # so Kevin chose a third reel a day instead (Oct 26 2026). Slides still render for the Story and shop page.
  post_carousel: false
  disclosure: "#ad As an Amazon Associate I earn from qualifying purchases."
  # The link DM. {user} is @their_name, {name} the product, {link} the affiliate link.
  dm_template: |-
    Hey {user}! 👋 Here's the {name} you asked about:
    {link}

    Prices change often, so check Amazon for today's price.
    New finds drop twice a day at @daily_tech_drops 📦

    #ad As an Amazon Associate I earn from qualifying purchases.
  # Public comment replies, rotated so they don't look like spam. {user} is @their_name.
  public_replies:
    - "Sent! Check your DMs {user} 📩"
    - "Just sent you the link {user} 🙌"
    - "Check your inbox {user}, it's on the way 📬"
    - "Done {user}! Link is in your DMs ✅"

schedule:
  # Used when the Sunday research fills a week. Times are Eastern.
  posts_per_day: 3               # 3 reels a day from Oct 26 2026 (Kevin)
  times: ["11:30", "19:00"]      # the two fixed daily slots
  # The third reel is the posting-time test: it rotates through these, one per day in order,
  # and the weekly report compares reach by time of day.
  test_times: ["15:30", "08:00", "13:30", "21:30"]

reel:
  width: 1080
  height: 1920
  fps: 30
  seconds_per_beat_without_voice: 2.8
  music_volume: 0.32             # background music level under the voiceover
  font: assets/fonts/Inter-ExtraBold.otf
  body_font: assets/fonts/Inter-Medium.otf
  accent_color: "#E8792B"       # matches the orange D logo
  background_color: "#FBF6EE"   # warm cream: light and airy, never black
  ink_color: "#3B2F27"          # warm dark brown for text
  muted_color: "#7A6A5D"        # secondary text

voice:
  provider: kokoro               # kokoro (free, most natural) | piper (free) | elevenlabs (paid) | none
  kokoro_voice: af_heart         # chosen by Kevin 2026-10-20
  kokoro_speed: 1.05
  piper_voice: en_US-ryan-high   # free Piper voice; samples at rhasspy.github.io/piper-samples
  piper_speed: 0.9               # below 1 speaks faster
  voice_id: "pNInz6obpgDQGcFmaJgB"   # ElevenLabs only
  model_id: eleven_multilingual_v2   # ElevenLabs only

writer:
  # Used only when a product in a week file has no pre-written content
  # and the ANTHROPIC_API_KEY secret is set (paid). Otherwise a template is used.
  model: claude-opus-5-5
  effort: medium

# Niche lanes rotated so the feed stays varied, best performers first.
# Lighting and room decor was dropped in Oct 2026: it drew the fewest views.
lanes:
  - desk and productivity setup (stands, monitor bars, cable management)
  - phone, travel and charging gadgets
  - home security and safety gadgets (trackers, detectors, locks)
  - robots, clocks and fun tech
