# Daily Tech Drops: brand and pipeline settings.
# Secrets (API keys, tokens) never go here. They live in GitHub Actions secrets.

brand:
  name: Daily Tech Drops
  handle: daily_tech_drops
  voice: >
    Upbeat gadget fan with "you gotta see this" energy, showing the coolest
    tech finds on Amazon. Lead with the wow moment in the first second, then
    why people want it. One useful tip per product. Short sentences, plain
    words, no tired hype like "game changer".

amazon:
  # Your Amazon Associates tracking tag, for example dailytechdrops-20.
  # Read from the AMAZON_TAG secret if set; this value is the fallback.
  tag: ""
  marketplace: www.amazon.com

instagram:
  comment_keyword: SHOP          # Viewers comment this word to get the link by DM
  hashtags_per_post: 8
  disclosure: "#ad As an Amazon Associate I earn from qualifying purchases."

schedule:
  # Used when the Sunday research fills a week. Times are Eastern.
  posts_per_day: 2
  times: ["11:30", "19:00", "15:00", "21:00"]   # first posts_per_day of these are used

reel:
  width: 1080
  height: 1920
  fps: 30
  seconds_per_beat_without_voice: 2.8
  music_volume: 0.12             # background music level under the voiceover
  font: assets/fonts/Inter-ExtraBold.otf
  body_font: assets/fonts/Inter-Medium.otf
  accent_color: "#E8792B"       # matches the orange D logo
  background_color: "#FBF6EE"   # warm cream: light and airy, never black
  ink_color: "#3B2F27"          # warm dark brown for text
  muted_color: "#7A6A5D"        # secondary text

voice:
  provider: piper                # piper (free, runs on GitHub) | elevenlabs (paid) | none
  piper_voice: en_US-ryan-high   # free Piper voice; samples at rhasspy.github.io/piper-samples
  piper_speed: 0.9               # below 1 speaks faster
  voice_id: "pNInz6obpgDQGcFmaJgB"   # ElevenLabs only
  model_id: eleven_multilingual_v2   # ElevenLabs only

writer:
  # Used only when a product in a week file has no pre-written content
  # and the ANTHROPIC_API_KEY secret is set (paid). Otherwise a template is used.
  model: claude-opus-5-5
  effort: medium

# Niche lanes rotated so the feed stays varied.
lanes:
  - smart lighting and room decor (lamps, LED panels, smart mirrors)
  - clocks and desk gadgets
  - robots and fun tech
  - phone, travel and charging gadgets
  - smart home and kitchen tech
  - gaming and desk setup
