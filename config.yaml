# Daily Tech Drops: brand and pipeline settings.
# Secrets (API keys, tokens) never go here. They live in GitHub Actions secrets.

brand:
  name: Daily Tech Drops
  handle: daily_tech_drops
  voice: >
    Upbeat gadget fan with "you gotta see this" energy, showing the coolest
    tech finds on Amazon. Lead with the wow moment in the first second, then
    why people want it. One useful tip per product. Short sentences, plain
    words, no tired hype like "game changer".

amazon:
  # Your Amazon Associates tracking tag, for example dailytechdrops-20.
  # Read from the AMAZON_TAG secret if set; this value is the fallback.
  tag: ""
  marketplace: www.amazon.com
  # Extra tracking IDs made in Associates Central (Account Settings > Manage Tracking IDs),
  # one per channel, so the Orders report shows where each sale came from.
  # Leave one empty and that channel keeps the base tag above.
  channel_tags:
    shop: ""        # the shop page (IG bio, SHOP DMs)
    facebook: ""    # links in Facebook reel captions
    youtube: ""     # links in YouTube Shorts descriptions
    threads: ""     # links in Threads posts
  # Creator Connections (Kevin invited Oct 26 2026): brands pay a bonus commission on top of the
  # normal rate, but only through the campaign's own link ("Get affiliate link" on the campaign page).
  # ASIN: link. Every post, DM and shop card for that ASIN then uses it. Remove an entry when
  # its campaign ends.
  campaign_links:
    # zakotu MD10 mini body camera, 25%, ends 2027-03-30
    B0HJ1HXBWY: "https://www.amazon.com/dp/B0HJ1HXBWY?ref=t_ac_view_request_product_image&campaignId=amzn1.campaign.2ZDVTB3J15QZ5&linkCode=tr1&tag=thegadgetgrab-20&linkId=amzn1.campaign.2ZDVTB3J15QZ5_1793023526145"
    # SYLCXX electric letter opener, 25%, ends 2026-11-17
    B0BZDJCGSR: "https://www.amazon.com/dp/B0BZDJCGSR?ref=t_ac_view_request_product_image&campaignId=amzn1.campaign.2W47CLDX1VN6F&linkCode=tr1&tag=thegadgetgrab-20&linkId=amzn1.campaign.2W47CLDX1VN6F_1793023578395"
    # ShSiXin 3-in-1 Apple Watch charging cable, 30%, ends 2026-11-18
    B0C19CBT2N: "https://www.amazon.com/dp/B0C19CBT2N?ref=t_ac_view_request_product_image&campaignId=amzn1.campaign.14PEBM1R5AEMY&linkCode=tr1&tag=thegadgetgrab-20&linkId=amzn1.campaign.14PEBM1R5AEMY_1793023615034"

analytics:
  # GoatCounter site code (free, goatcounter.com): counts shop page visits and which
  # product cards are tapped. The weekly report reads it with the GOATCOUNTER_TOKEN secret.
  goatcounter: dailytechdrops

pinterest:
  # Pinterest developer app "Daily Tech Drops Pin Poster" (Trial access approved Oct 27 2026).
  # Secrets: PINTEREST_APP_SECRET and PINTEREST_REFRESH_TOKEN (workflow "Connect Pinterest").
  app_id: "1630232"
  redirect_uri: https://dailytechdrops.github.io/pinterest-connect.html
  # Each reel goes to the board for the first keyword found in its lane. Instagram's own
  # auto-publish already fills "Daily Tech Drops: New Finds", so these pins go elsewhere.
  boards:
    desk: Desk Setup Gadgets
    travel: Travel Tech
    phone: Phone & Car Accessories
    charging: Phone & Car Accessories
    home: Home & Kitchen Gadgets
    kitchen: Home & Kitchen Gadgets
    robot: Gaming & Entertainment Gear
    gaming: Gaming & Entertainment Gear
    fun: Gaming & Entertainment Gear
  default_board: Tech Gift Ideas

instagram:
  comment_keyword: SHOP          # Viewers comment this word to get the link by DM
  comment_aliases: [LINK]        # Also answered, since people guess these
  hashtags_per_post: 5           # Instagram now counts at most 5; extra tags are wasted
  # Separate carousels reached 1 to 8 people while reels reached about 100 (report, Oct 25 2026),
  # so Kevin chose a third reel a day instead (Oct 26 2026). Slides still render for the Story and shop page.
  post_carousel: false
  disclosure: "#ad As an Amazon Associate I earn from qualifying purchases."
  # The link DM. {user} is @their_name, {name} the product, {link} the affiliate link.
  dm_template: |-
    Hey {user}! 👋 Here's the {name} you asked about:
    {link}

    Prices change often, so check Amazon for today's price.
    New finds drop twice a day at @daily_tech_drops 📦

    #ad As an Amazon Associate I earn from qualifying purchases.
  # Public comment replies, rotated so they don't look like spam. {user} is @their_name.
  public_replies:
    - "Sent! Check your DMs {user} 📩"
    - "Just sent you the link {user} 🙌"
    - "Check your inbox {user}, it's on the way 📬"
    - "Done {user}! Link is in your DMs ✅"

engagement:
  # Public replies to comments on our posts (python -m dtd engage, workflow "Comment replies").
  # Comments that say SHOP or LINK are left to the Meta Business Suite auto-DM, so nothing is sent twice.
  # No prices and no links in these replies (Amazon Associates rules), so no disclosure is needed.
  # {user} is @their_name on Instagram and empty on Facebook. Set enabled: false to pause.
  enabled: true
  facebook: true
  replies:
    price:
      - "Prices change often on Amazon {user}, so comment SHOP and we will DM you the link to check today's price 📩"
      - "Great question {user}! Amazon prices move a lot, so comment SHOP and we will send you the link to see the current price 🙌"
    want:
      - "Comment SHOP {user} and we will DM you the Amazon link 📩"
      - "Easy {user}! Just comment SHOP and the link lands in your DMs 📬"
      - "We got you {user}! Comment SHOP and we will send the link straight to your DMs 🙌"
    question:
      - "Good question {user}! The Amazon listing has all the details. Comment SHOP and we will DM you the link 📩"
      - "Great question {user}! Comment SHOP and we will send you the Amazon link so you can check the full specs 🙌"
    praise:
      - "Glad you like it {user}! 🙌"
      - "Right?! Thanks {user} 🔥"
      - "Thanks {user}! Comment SHOP if you want the link 📩"
      - "Appreciate you {user}! More finds drop every day 📦"

comment_targets:
  # Daily list of other accounts' reels worth a comment (python -m dtd targets, workflow "Comment targets"),
  # at docs/comments.html. Nothing is posted automatically: Kevin opens each reel and pastes the comment,
  # since automated comments on other accounts are an Instagram spam signal.
  # Comments never carry links, prices, "follow me" or "check my page". Instagram flags the same text
  # posted over and over, so the list never repeats a line within a day.
  per_day: 12
  max_age_days: 3          # only reels this recent, so the comment lands while people still watch
  min_followers: 3000      # tiny accounts send little traffic back
  max_followers: 2000000   # comments on the giants are buried within minutes
  # Checked through Instagram's Business Discovery. Only creator or business accounts can be looked up;
  # any that cannot are listed at the bottom of the page so they can be swapped out. Without the API
  # the page rotates through this list in order, so niche and mid-size accounts come first.
  accounts: [
    gadgetflow, yankodesign, flossycarter, grovemade, sara_dietschy, orbitkey, coolmaterial, zollotech,
    satechi, dave2d, nomadgoods, designmilk, keychron, austinevans, peakdesign, uncrate, nanoleaf,
    bellroy, 9to5mac, elgato, techburner, gizmodo, engadget, ijustine, unboxtherapy, theverge,
    mrwhosetheboss, cnet, techinsider, mkbhd, interestingengineering,
  ]
  # Hashtags whose newest videos are also checked (Instagram allows 30 different hashtags a week).
  hashtags: [desksetup, techgadgets, gadgets, setupinspiration, cooltech]
  comments:
    - "This is such a clever find, saving this one for later!"
    - "Never knew this existed, great pick. Does it work well day to day?"
    - "Love this setup, the details make it. Thanks for sharing!"
    - "Okay this is genuinely useful. Saving it!"
    - "Such a smart idea, how long have you been using it?"
    - "The little details on this are so well thought out."
    - "This would fix a daily annoyance for me, great find."
    - "Clean setup! What made you pick this one?"
    - "Did not expect this to look this good, nice pick."
    - "Adding this to my list, thanks for the honest look."
    - "Love finds like this. Does it hold up after a few weeks?"
    - "This is the kind of upgrade that makes a real difference."
    - "Really well shot, and the product looks great too."
    - "Simple and clever, my favorite combination."
    - "This made my feed better today, thanks for sharing!"

schedule:
  # Used when the Sunday research fills a week. Times are Eastern.
  # 3 reels a day from Oct 26 2026; back to 2 on Oct 30 2026 (Kevin): views fell from ~100 to 1-5
  # after remixes began, so remixes are paused (paused/) until reach recovers.
  posts_per_day: 2
  times: ["11:30", "19:00"]      # the two fixed daily slots
  # The third reel is the posting-time test: it rotates through these, one per day in order,
  # and the weekly report compares reach by time of day.
  test_times: ["15:30", "08:00", "13:30", "21:30"]

reel:
  look: natural                  # natural: real footage of people (clip_ids) and captions without a card | card: the Oct 26 look
  width: 1080
  height: 1920
  fps: 30
  seconds_per_beat_without_voice: 2.8
  music_volume: 0.32             # background music level under the voiceover
  font: assets/fonts/Inter-ExtraBold.otf
  body_font: assets/fonts/Inter-Medium.otf
  accent_color: "#E8792B"       # matches the orange D logo
  background_color: "#FBF6EE"   # warm cream: light and airy, never black
  ink_color: "#3B2F27"          # warm dark brown for text
  muted_color: "#7A6A5D"        # secondary text

voice:
  provider: kokoro               # kokoro (free, most natural) | piper (free) | elevenlabs (paid) | none
  kokoro_voice: af_heart         # chosen by Kevin 2026-10-20
  kokoro_speed: 1.05
  piper_voice: en_US-ryan-high   # free Piper voice; samples at rhasspy.github.io/piper-samples
  piper_speed: 0.9               # below 1 speaks faster
  voice_id: "pNInz6obpgDQGcFmaJgB"   # ElevenLabs only
  model_id: eleven_multilingual_v2   # ElevenLabs only

writer:
  # Used only when a product in a week file has no pre-written content
  # and the ANTHROPIC_API_KEY secret is set (paid). Otherwise a template is used.
  model: claude-opus-5-5
  effort: medium

# Niche lanes rotated so the feed stays varied, best performers first.
# Lighting and room decor was dropped in Oct 2026: it drew the fewest views.
lanes:
  - desk and productivity setup (stands, monitor bars, cable management)
  - phone, travel and charging gadgets
  - home security and safety gadgets (trackers, detectors, locks)
  - robots, clocks and fun tech
