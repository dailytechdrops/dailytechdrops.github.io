name: Pages probe
on:
  push:
    branches: [claude/pages-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          r=$(curl -s -o /tmp/o -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/${{ github.repository }}/pages -d '{"source":{"branch":"main","path":"/docs"}}')
          echo "::notice title=POST pages::$r $(head -c 300 /tmp/o | tr '\n' ' ')"
          g=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/${{ github.repository }}/pages | head -c 300 | tr '\n' ' ')
          echo "::notice title=GET pages::$g"
