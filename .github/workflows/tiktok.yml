name: TikTok

# Every hour: post the newest reel already posted to Instagram to TikTok, through Buffer.
# Separate from Post and reply so a TikTok problem never delays Instagram.
# Set the repo variable TIKTOK_POSTING to "off" to pause; then runs only check the Buffer connection.

on:
  schedule:
    - cron: "47 * * * *"
  # GitHub often skips or delays hourly schedules by hours, so also run right after each post.
  workflow_run:
    workflows: ["Post and reply"]
    types: [completed]
  workflow_dispatch:
    inputs:
      item:
        description: "Optional: id of one posted reel to send, e.g. 2026-10-27-1130-B0D54JZTHY"
        required: false

permissions:
  contents: write

concurrency:
  group: state-writes
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Check out the branch tip, not the commit that queued this run, so a run that waited
      # behind another sees its post history (Nov 1 2026 a stale run posted a reel twice).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: git fetch origin media || true

      - name: Post the next TikTok
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          TIKTOK_POSTING: ${{ vars.TIKTOK_POSTING || 'on' }}   # on unless the repo variable says off
          TIKTOK_ITEM: ${{ inputs.item }}
        run: python -m dtd tiktok-due

      - name: Save state
        if: always()
        run: |
          git config user.name "daily-tech-drops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "Record TikTok posts"
          git pull --rebase origin "${{ github.ref_name }}"
          git push
# Schedule re-registered after the move to the dailytechdrops org (Oct 28 2026).
