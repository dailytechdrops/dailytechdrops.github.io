name: Music probe
on:
  push:
    paths: [".github/workflows/music-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sL -A 'Mozilla/5.0' https://freepd.com/ -o /tmp/home.html
          echo "::notice::scripts: $(grep -oiE '(src|href)=[^ >]+' /tmp/home.html | head -30 | tr '\n' ' ')"
          echo "::notice::body: $(sed 's/<[^>]*>/ /g' /tmp/home.html | tr -s ' \n' ' ' | head -c 700)"
          for u in https://freepd.com/music.json https://freepd.com/data.json https://freepd.com/sitemap.xml; do
            echo "::notice::probe $u -> $(curl -sL -o /tmp/p -w '%{http_code} %{size_download}' -A 'Mozilla/5.0' "$u") $(head -c 200 /tmp/p | tr '\n' ' ')"
          done
