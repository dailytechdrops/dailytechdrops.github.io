name: Music probe
on:
  push:
    paths: [".github/workflows/music-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://freepd.com/ https://freepd.com/music/ https://freepd.com/upbeat.php https://freepd.com/music/Upbeat%20Party.mp3; do
            echo "== $u -> $(curl -sL -o /tmp/p -w '%{http_code} %{content_type} %{size_download}' -A 'Mozilla/5.0' "$u")"
          done
          curl -sL -A 'Mozilla/5.0' https://freepd.com/ -o /tmp/home.html
          grep -oiE 'href="[^"]+"' /tmp/home.html | head -40
          grep -oiE '[^"'"'"' >]+\.mp3' /tmp/home.html | head -10
