name: Facebook check
on:
  push:
    paths: [".github/workflows/fb-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          PT=$(curl -s "https://graph.facebook.com/v23.0/$FB_PAGE_ID?fields=access_token&access_token=$FB_PAGE_TOKEN" | python3 -c "import sys,json;print(json.load(sys.stdin).get('access_token',''))")
          [ -n "$PT" ] && echo "::notice::derived a page token from the saved key" || echo "::error::could not derive a page token"
          [ -n "$PT" ] || exit 0
          echo "::add-mask::$PT"
          d=$(curl -s "https://graph.facebook.com/v23.0/debug_token?input_token=$PT&access_token=$PT" | python3 -c "import sys,json;d=json.load(sys.stdin).get('data',{});print({k:d.get(k) for k in ('type','expires_at','is_valid','scopes')})")
          echo "::notice::derived token: $d"
          r=$(curl -s -X POST "https://graph.facebook.com/v23.0/$FB_PAGE_ID/video_reels" -d upload_phase=start -d access_token=$PT | head -c 300 | sed -E 's#https?://[^"]*#<url>#g')
          echo "::notice::reel upload start with derived token (nothing is posted): $r"
