name: Pixabay search

# Manual: prints the top Pixabay video hits (id, size, seconds, tags) for a list of queries (one per line).
on:
  push:
    branches: [claude/week-2026-11-25]
    paths: [tools/pixabay_queries.txt]

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse
          for q in open("tools/pixabay_queries.txt").read().splitlines():
              q = q.strip()
              if not q: continue
              url = "https://pixabay.com/api/videos/?" + urllib.parse.urlencode({"key": os.environ["PIXABAY_API_KEY"], "q": q, "per_page": 12, "safesearch": "true", "video_type": "film"})
              import time
              try:
                  hits = json.load(urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}))).get("hits", [])
              except Exception as e:
                  print("== ERR", q, e); time.sleep(20); continue
              time.sleep(2)
              print("==", q)
              for h in hits:
                  v = h["videos"].get("large") or h["videos"].get("medium") or {}
                  print(h["id"], f'{v.get("width")}x{v.get("height")}', h.get("duration"), h.get("tags"))
          PY
