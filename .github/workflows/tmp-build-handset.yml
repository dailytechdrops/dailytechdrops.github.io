name: tmp build handset reel
on:
  push:
    branches: [claude/project-thread-9fp61h]
    paths: ['.github/workflows/tmp-build-handset.yml']
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install kokoro soundfile "preshed<3.0.14"
          python -c "from kokoro import KPipeline; KPipeline(lang_code='a')"
      - env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python tools/product_reel.py retro-phone-handset-stock --out assets/reels/retro-phone-handset-stock.mp4
      - run: |
          git config user.name "daily-tech-drops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/reels/retro-phone-handset-stock.mp4
          git commit -m "Build retro handset reel v2"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
# v2
