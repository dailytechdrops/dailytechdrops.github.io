name: Publish drop

on:
  issues:
    types: [labeled]
  workflow_call:
    inputs:
      date:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      date:
        description: "Date to publish (YYYY-MM-DD)"
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: state-writes
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'issues' || (github.event.label.name == 'approved' && startsWith(github.event.issue.title, 'Drop ')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Work out the date
        id: day
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          DAY="${{ inputs.date }}"
          if [ -z "$DAY" ]; then DAY=$(echo "$TITLE" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1); fi
          echo "date=$DAY" >> "$GITHUB_OUTPUT"

      - name: Fetch the draft from the media branch
        run: |
          DAY="${{ steps.day.outputs.date }}"
          git fetch origin media
          mkdir -p output
          git archive origin/media "$DAY" | tar -x -C output

      - name: Post to Instagram
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
        run: python -m dtd publish --date "${{ steps.day.outputs.date }}"

      - name: Save post history
        if: always()
        run: |
          git config user.name "daily-tech-drops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "Published ${{ steps.day.outputs.date }}"
          git pull --rebase origin "${{ github.ref_name }}"
          git push

      - name: Close the approval issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state open --search "Drop ${{ steps.day.outputs.date }} in:title" --json number -q '.[0].number')
          [ -n "$NUM" ] && gh issue close "$NUM" --comment "Posted to Instagram." || true

      - name: Flag a failure on the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state open --search "Drop ${{ steps.day.outputs.date }} in:title" --json number -q '.[0].number')
          [ -n "$NUM" ] && gh issue comment "$NUM" --body "Posting failed. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
