name: Pixabay sheet
on:
  push:
    branches: [claude/project-thread-opew4i]
    paths: [tools/pixabay_sheet.py, .github/workflows/pixabay-sheet.yml]
permissions:
  contents: write
jobs:
  sheet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pillow
      - env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python tools/pixabay_sheet.py "phone stand" "phone holder desk" "smartphone stand" "cable clip" "cable organizer" "usb cable" "charging cable" "webcam" "webcam cover" "laptop camera"
      - run: |
          git config user.name "daily-tech-drops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sheets && git commit -m "Temporary Pixabay contact sheets" && git push
