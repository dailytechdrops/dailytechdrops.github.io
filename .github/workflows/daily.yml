name: Daily drop

on:
  schedule:
    - cron: "0 11 * * *"   # 7:00 a.m. Eastern (daylight time); drafts are ready before the 11:30 post
  workflow_dispatch:
    inputs:
      date:
        description: "Date to generate (YYYY-MM-DD), blank for today"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-drop
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      date: ${{ steps.day.outputs.date }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and Python packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Set date
        id: day
        run: |
          DAY="${{ inputs.date }}"
          echo "date=${DAY:-$(TZ=America/New_York date +%F)}" >> "$GITHUB_OUTPUT"

      - name: Generate draft
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
        run: python -m dtd generate --date "${{ steps.day.outputs.date }}"

      - name: Store media on the media branch
        run: |
          DAY="${{ steps.day.outputs.date }}"
          git config user.name "daily-tech-drops-bot"
          git config user.email "actions@users.noreply.github.com"
          mv "output/$DAY" "/tmp/$DAY"
          git fetch origin media || true
          if git rev-parse --verify origin/media >/dev/null 2>&1; then
            git worktree add /tmp/media origin/media
            git -C /tmp/media switch -c media
          else
            git worktree add --orphan -b media /tmp/media
          fi
          rm -rf "/tmp/media/$DAY" && mv "/tmp/$DAY" "/tmp/media/$DAY"
          git -C /tmp/media add -A
          git -C /tmp/media commit -m "Media for $DAY"
          git -C /tmp/media push origin media

      - name: Open approval issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DAY="${{ steps.day.outputs.date }}"
          RAW="https://github.com/${{ github.repository }}/raw/media/$DAY"
          CAPTION=$(python -c "import json;print(json.load(open('/tmp/media/$DAY/draft.json'))['caption'])")
          {
            echo "**Product:** ${{ steps.gen.outputs.product }}"
            echo
            echo "**Reel:** [watch reel.mp4]($RAW/reel.mp4)"
            echo
            echo "**Carousel:**"
            for f in /tmp/media/$DAY/slide_*.jpg; do echo "<img src=\"$RAW/$(basename $f)\" width=\"220\">"; done
            echo
            echo "**Caption:**"
            echo '```'
            echo "$CAPTION"
            echo '```'
            echo
            echo "Add the label **approved** to post it, or close this issue to skip the day."
          } > /tmp/body.md
          gh label create approved --color 2EA043 --description "Post this drop" 2>/dev/null || true
          gh issue create --title "Drop $DAY: ${{ steps.gen.outputs.product }}" --body-file /tmp/body.md

  # Labels added by the workflow's own token do not trigger other workflows,
  # so auto-publish calls the publish workflow directly.
  auto-publish:
    needs: generate
    if: ${{ vars.AUTO_PUBLISH == 'true' }}
    uses: ./.github/workflows/publish.yml
    with:
      date: ${{ needs.generate.outputs.date }}
    secrets: inherit
