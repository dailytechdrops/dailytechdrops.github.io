name: YouTube Shorts

# Every hour: upload the newest reel already posted to Instagram as a YouTube Short.
# Separate from Post and reply so a YouTube problem never delays Instagram.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      item:
        description: "Optional: id of one posted reel to upload, e.g. 2026-10-20-1730-B002L6BZXC"
        required: false

permissions:
  contents: write

concurrency:
  group: state-writes
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: git fetch origin media || true

      - name: Upload the next Short
        env:
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ vars.YOUTUBE_PRIVACY }}
          YOUTUBE_ITEM: ${{ inputs.item }}
        run: python -m dtd youtube-due

      - name: Save state
        if: always()
        run: |
          git config user.name "daily-tech-drops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "Record YouTube uploads"
          git pull --rebase origin "${{ github.ref_name }}"
          git push
