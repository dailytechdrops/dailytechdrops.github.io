name: Temporary photo sheets
on:
  push:
    branches: [claude/project-thread-lddyrh]
    paths: [tools/photo_sheet.py, .github/workflows/tmp-photo-sheets.yml, tmp-queries.txt]
permissions:
  contents: write
jobs:
  sheets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml requests pillow
      - env: { PIXABAY_API_KEY: "${{ secrets.PIXABAY_API_KEY }}" }
        run: python tools/photo_sheet.py weeks/2026-10-26.yaml weeks/2026-10-31.yaml
      - run: |
          git config user.name "daily-tech-drops-bot"; git config user.email "actions@users.noreply.github.com"
          git add tmp-sheets && git commit -m "Temporary photo sheets" && git push
