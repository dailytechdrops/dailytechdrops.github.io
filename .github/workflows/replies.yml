name: Comment link DMs

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes; GitHub may run it a few minutes late
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: state-writes
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send link DMs
        if: ${{ vars.KEYWORD_DMS != 'off' }}
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m dtd reply

      - name: Save replied comments
        run: |
          git config user.name "daily-tech-drops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet && exit 0
          git commit -m "Record link DMs"
          git pull --rebase origin "${{ github.ref_name }}"
          git push
