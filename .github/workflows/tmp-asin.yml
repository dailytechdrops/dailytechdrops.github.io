name: tmp asin
on:
  push:
    branches: [claude/project-thread-9fp61h]
    paths: ['.github/workflows/tmp-asin.yml']
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - run: |
          cat > f.py <<'EOF'
          import re,sys,urllib.request
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          for q in ['cyaneagle retro phone handset','retro phone handset type-c iphone android 2027']:
              req=urllib.request.Request('https://www.amazon.com/s?k='+q.replace(' ','+'),headers={'User-Agent':UA,'Accept-Language':'en-US,en;q=0.9'})
              try: h=urllib.request.urlopen(req).read().decode('utf8','ignore')
              except Exception as e: print('ERR',e); continue
              print('==',q,len(h))
              print(re.findall(r'<title[^>]*>([^<]*)',h)[:2])
              txt=re.sub(r'<script.*?</script>|<style.*?</style>','',h,flags=re.S)
              txt=re.sub(r'<[^>]+>',' ',txt); txt=re.sub(r'\s+',' ',txt)
              print(txt[:600])
              print(sorted(set(re.findall(r'/dp/([A-Z0-9]{10})',h)))[:20])
              print(sorted(set(re.findall(r'data-asin="([A-Z0-9]{10})"',h)))[:20])
              for m in re.finditer(r'cyaneagle',h,re.I): print(h[max(0,m.start()-150):m.end()+100].replace('\n',' ')); break
          EOF
          python3 f.py
