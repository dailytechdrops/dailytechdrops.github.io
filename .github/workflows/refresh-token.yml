name: Refresh Instagram token

# Instagram and Threads long-lived tokens expire after 60 days. This renews them monthly.
# Needs a GH_PAT secret: a fine-grained token for this repo with "Secrets: read and write".

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh and store the token
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW=$(python -m dtd refresh-token)
          echo "::add-mask::$NEW"
          gh secret set IG_ACCESS_TOKEN --repo "${{ github.repository }}" --body "$NEW"
      - name: Refresh and store the Threads token
        if: ${{ always() }}
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          [ -n "$THREADS_ACCESS_TOKEN" ] || { echo "Threads not connected; skipping."; exit 0; }
          NEW=$(python -m dtd refresh-threads-token)
          echo "::add-mask::$NEW"
          gh secret set THREADS_ACCESS_TOKEN --repo "${{ github.repository }}" --body "$NEW"
