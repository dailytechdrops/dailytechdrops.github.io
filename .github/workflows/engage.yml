name: Comment replies

# Every 30 minutes: a short friendly reply to new comments on our Instagram posts (and Facebook
# reels when the Page token allows it), nudging people to comment SHOP. Comments that already say
# SHOP are left to the Meta Business Suite auto-DM. Rules and wording: dtd/engage.py, config.yaml.
# On a pull request that changes it, only does a dry run and shows what it would reply.

on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:
  pull_request:
    paths: ["dtd/engage.py", "dtd/instagram.py", "dtd/facebook.py", ".github/workflows/engage.yml"]

permissions:
  contents: write

# Separate from Post and reply, which can hold its own group for hours while it waits to post.
concurrency:
  group: engage
  cancel-in-progress: false

jobs:
  engage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Reply to comments
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          ENGAGE_DRY_RUN: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: |
          python -m dtd engage | tee /tmp/engage.txt
          { echo '```'; cat /tmp/engage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Save state
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "daily-tech-drops-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/engaged.json
          git diff --cached --quiet && exit 0
          git commit -m "Update comment replies"
          git pull --rebase origin "${{ github.ref_name }}"
          git push
# Schedule re-registered after the move to the dailytechdrops org (Oct 28 2026).
