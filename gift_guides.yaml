# Holiday gift guides (holiday plan in the README). Each guide is its own page at docs/gifts/<slug>.html, with a
# tall Pinterest pin image at docs/gifts/<slug>.jpg (python -m dtd gift-pins). The shop page shows a "Gift guides"
# row between show_from and show_until. Pages stay up all season, so pins made early keep working.
#
# A product is listed once it has posted (so every card has its reel and photo), newest first. Add it here by
# ASIN, or give its week file entry `gift_guide: <slug>` and it joins on its own. ASINs from shop_archive.yaml
# also work. Never put a price or price band in a title or blurb; prices change daily (Associates rule).

